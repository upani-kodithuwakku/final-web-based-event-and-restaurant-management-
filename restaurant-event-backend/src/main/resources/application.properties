spring.application.name=restaurant-event-system
spring.config.import=optional:dotenv:

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:restaurant_event_db}?useSSL=false&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

app.jwt.secret=${JWT_SECRET:fallback-secret-for-dev-only-change-in-production-must-be-64-chars}
app.jwt.expiration-ms=86400000

app.reservation.default-duration-minutes=120

# Required roles are initialized automatically; sample accounts are opt-in only.
app.seed.demo-users=${SEED_DEMO_USERS:false}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

logging.level.com.group06.restaurantevent=DEBUG
