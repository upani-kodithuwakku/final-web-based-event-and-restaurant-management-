spring.application.name=restaurant-event-system
spring.config.import=optional:dotenv:

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:restaurant_event_db}?useSSL=false&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${SERVER_PORT:8081}

app.jwt.secret=${JWT_SECRET:fallback-secret-for-dev-only-change-in-production-must-be-64-chars}
app.jwt.expiration-ms=86400000

app.reservation.default-duration-minutes=120

# Required roles are initialized automatically; sample accounts are opt-in only.
app.seed.demo-users=${SEED_DEMO_USERS:false}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

logging.level.com.group06.restaurantevent=DEBUG


# Customer management: password reset with optional SMTP delivery.
app.frontend-url=${FRONTEND_URL:http://localhost:5174}
app.auth.reset-token-minutes=30
# Local demo only: also return the reset link in the API response.
app.auth.expose-reset-link=${EXPOSE_RESET_LINK:false}

# Reservation deposit in LKR per guest
app.reservation.deposit-per-guest=500

# Add missing celebration packages once; preserve existing prices and active flags.
app.seed.event-catalog=${SEED_EVENT_CATALOG:true}

# Optional SMTP: enable only after configuring your own mail account.
app.auth.mail-enabled=${MAIL_ENABLED:false}
app.auth.mail-from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
